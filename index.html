<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<meta name="mobile-web-app-capable" content="yes"/>

<title>ComiditApp</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh;overscroll-behavior-y:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* ── Header tipo app ── */
.app-header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:#fff;position:sticky;top:0;z-index:20;border-bottom:0.5px solid rgba(0,0,0,0.08)}
.app-title-wrap{display:flex;align-items:center;gap:10px}
.app-icon{width:34px;height:34px;border-radius:10px;background:#E1F5EE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app-title{font-size:17px;font-weight:700;color:#0F6E56;line-height:1.1}
.app-subtitle{font-size:11px;color:#999;line-height:1.2}
.user-chip{display:flex;align-items:center;gap:7px;background:#f5f5f3;border-radius:20px;padding:5px 10px 5px 5px}
.avatar{width:26px;height:26px;border-radius:50%;background:#0F6E56;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-chip span{font-size:13px;font-weight:600}

/* ── Sync bar ── */
.sync-strip{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;font-size:11px;color:#999;background:#fff}
.sync-ok{color:#0F6E56}
.sync-err{color:#A32D2D}
.sync-spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-refresh{background:none;border:none;color:#0F6E56;font-size:11px;font-weight:600;display:flex;align-items:center;gap:3px}

/* ── Content area ── */
.content{flex:1;padding:14px 16px 90px;overflow-x:hidden}

/* ── Day carousel (swipe) ── */
.day-carousel{position:relative}
.day-carousel-track{display:flex;transition:transform 0.28s cubic-bezier(.22,1,.36,1)}
.day-slide{flex:0 0 100%;padding-right:0}
.day-dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.day-dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,0.15);transition:all 0.2s}
.day-dot.active{background:#0F6E56;width:18px;border-radius:3px}
.day-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.day-nav-btn{width:34px;height:34px;border-radius:50%;background:#fff;border:0.5px solid rgba(0,0,0,0.12);display:flex;align-items:center;justify-content:center;color:#666}
.day-nav-btn:active{background:#f0f0ee}
.day-nav-btn:disabled{opacity:0.3}
.day-title-big{font-size:18px;font-weight:700;text-align:center;flex:1}
.day-title-sub{font-size:12px;color:#999;text-align:center;font-weight:500}

/* ── Meal rows (app-style) ── */
.meal-card{background:#fff;border-radius:16px;padding:0;margin-bottom:10px;overflow:hidden;border:0.5px solid rgba(0,0,0,0.07)}
.meal-row-app{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.meal-row-app:active{background:#fafaf8}
.meal-row-app+.meal-row-app{border-top:0.5px solid rgba(0,0,0,0.06)}
.meal-icon-box{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.meal-icon-box.almuerzo{background:#E1F5EE;color:#0F6E56}
.meal-icon-box.cena{background:#E8E0FB;color:#5B3FA0}
.meal-icon-box.desayuno{background:#FAEEDA;color:#BA7517}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:15px;font-weight:700;line-height:1.2}
.meal-name small{font-size:11px;color:#aaa;font-weight:500}
.meal-status{font-size:12px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:4px}
.meal-status.off{color:#aaa;font-weight:500}
.meal-status.on{color:#0F6E56}
.meal-status.early{color:#3B6D11}
.meal-status.late{color:#854F0B}
.meal-status .tpl-dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:0.6;flex-shrink:0}
.meal-chevron{color:#ccc;flex-shrink:0}
.meal-row-app.locked{opacity:0.55}
.lock-badge{font-size:10px;color:#A32D2D;display:flex;align-items:center;gap:3px;margin-top:2px;font-weight:600}

/* ── Note row ── */
.note-card{background:#fff;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:9px;border:0.5px solid rgba(0,0,0,0.07);margin-bottom:10px}
.note-card input{flex:1;border:none;outline:none;font-size:13px;background:transparent;font-family:inherit}
.note-card input::placeholder{color:#bbb}
.note-card input:disabled{opacity:0.45}

/* ── Tab bar (bottom, app style) ── */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid rgba(0,0,0,0.1);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;z-index:30}
.tabbar-item{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;padding:4px;border:none;background:none}
.tabbar-item i{font-size:21px;color:#bbb}
.tabbar-item span{font-size:10px;color:#bbb;font-weight:600}
.tabbar-item.active i,.tabbar-item.active span{color:#0F6E56}

/* ── Bottom sheet (selector emergente) ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:90;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity 0.2s}
.sheet-overlay.show{opacity:1}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:8px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform 0.25s cubic-bezier(.22,1,.36,1)}
.sheet-overlay.show .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:8px auto 14px}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.sheet-subtitle{font-size:12px;color:#999;margin-bottom:16px}
.sheet-opts{display:flex;flex-direction:column;gap:8px}
.sheet-opt{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(0,0,0,0.1);background:#fff}
.sheet-opt.sel{border-color:#0F6E56;background:#E1F5EE}
.sheet-opt-label{font-size:15px;font-weight:600}
.sheet-opt.sel .sheet-opt-label{color:#0F6E56}
.sheet-time-row{display:flex;align-items:center;gap:10px;margin-top:14px;padding:0 2px}
.sheet-time-row label{font-size:13px;color:#666;font-weight:500}
.sheet-time-row input{flex:1;padding:9px 10px;border-radius:10px;border:0.5px solid rgba(0,0,0,0.18);font-size:14px;font-family:inherit}
.sheet-close{margin-top:14px;width:100%;padding:13px;border-radius:14px;background:#f5f5f3;border:none;font-size:14px;font-weight:600;color:#666}

/* ── Setup / welcome screen ── */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem 1.5rem;gap:1.75rem;text-align:center}
.welcome-icon{width:84px;height:84px;border-radius:24px;background:#E1F5EE;display:flex;align-items:center;justify-content:center}
.welcome-title{font-size:24px;font-weight:700;color:#0F6E56}
.welcome-subtitle{font-size:13px;color:#999;margin-top:2px}
.welcome-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.welcome-btn{width:100%;padding:15px;border-radius:16px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;border:none}
.welcome-btn.primary{background:#0F6E56;color:#fff}
.welcome-btn.primary:active{background:#0a5a45}
.welcome-btn.secondary{background:#fff;color:#1a1a1a;border:0.5px solid rgba(0,0,0,0.15)}
.welcome-btn.secondary:active{background:#f5f5f3}
.welcome-avatar-mini{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;font-size:11px}
.welcome-switch{font-size:12px;color:#999;margin-top:0.25rem}
.welcome-switch span{color:#0F6E56;font-weight:600}
.name-input-wrap{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.name-input-wrap input{padding:14px;border-radius:14px;border:1px solid rgba(0,0,0,0.18);font-size:16px;outline:none;font-family:inherit;text-align:center}
.name-input-wrap input:focus{border-color:#0F6E56}

/* ── Admin view ── */
.admin-summary-card{background:#fff;border-radius:16px;margin-bottom:10px;overflow:hidden;border:0.5px solid rgba(0,0,0,0.07)}
.admin-summary-hdr{padding:12px 14px;border-bottom:0.5px solid rgba(0,0,0,0.07);display:flex;justify-content:space-between;align-items:center}
.admin-summary-title{font-size:14px;font-weight:700}
.admin-summary-count{font-size:11px;color:#999;font-weight:600}
.admin-counts-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding-bottom:4px}
.ac{padding:13px 6px 8px;text-align:center;border-right:0.5px solid rgba(0,0,0,0.06)}
.ac:last-child{border-right:none}
.ac-label{font-size:10px;color:#999;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:5px}
.ac-num-wrap{display:flex;align-items:baseline;justify-content:center;gap:3px;flex-wrap:wrap;min-height:34px}
.ac-num-main{font-size:27px;font-weight:800;color:#0F6E56;line-height:1;letter-spacing:-0.02em}
.ac-num-main.zero{color:#ccc;font-size:19px;font-weight:700}
.ac-badge{font-size:10px;font-weight:700;padding:2px 5px;border-radius:7px;line-height:1.4;white-space:nowrap}
.ac-badge.early{background:#EAF3DE;color:#3B6D11;border:1px solid #639922}
.ac-badge.late{background:#FAEEDA;color:#854F0B;border:1px solid #BA7517}
.admin-meal-line{padding:6px 14px 8px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;border-top:0.5px solid rgba(0,0,0,0.05);background:#FAFAF8}
.admin-meal-verb{font-size:10px;font-weight:700;color:#999;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:0.02em}
.admin-meal-tags{display:flex;flex-wrap:wrap;gap:4px}
.ntag{padding:2px 7px;border-radius:8px;font-size:10px;font-weight:600;background:#fff!important;border:1px solid rgba(0,0,0,0.1)!important;color:#555!important}
.ntag .ntag-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.day-note-admin{font-size:11px;color:#854F0B;background:#FAEEDA;padding:7px 14px;display:flex;gap:6px;align-items:center;border-top:0.5px solid rgba(0,0,0,0.05)}

/* ── Semana tipo / Invitados (reuse card style) ── */
.tpl-day-card,.guests-mgr{background:#fff;border-radius:16px;margin-bottom:10px;overflow:hidden;border:0.5px solid rgba(0,0,0,0.07);padding:0}
.tpl-day-header{padding:11px 14px;font-weight:700;font-size:14px;border-bottom:0.5px solid rgba(0,0,0,0.07)}
.tpl-intro{font-size:12px;color:#999;line-height:1.6;margin-bottom:14px;padding:0 2px}
.guests-mgr{padding:14px}
.guests-mgr h4{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.guest-row-item{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.guest-row-item input{flex:1;padding:9px 10px;border-radius:10px;border:0.5px solid rgba(0,0,0,0.15);font-size:13px;font-family:inherit;outline:none}
.del-btn{width:30px;height:30px;border-radius:50%;border:none;background:#FCEBEB;color:#A32D2D;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-btn{font-size:13px;color:#0F6E56;background:none;border:none;display:flex;align-items:center;gap:5px;font-weight:700;padding:4px 0}
.guest-name-label{padding:8px 14px 2px;font-size:11px;color:#999;font-weight:700;border-top:0.5px solid rgba(0,0,0,0.06)}
.section-title{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.05em;margin:1rem 0 8px 2px}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="root"></div>
</div>
<script>
/* ════════ CONFIG ════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyL04xgWxYT-ri0t2_5PUmYWMvLnBt1JWsm73-nRhPh7RXxY5JkIZ_QRPt5LMdodkOMsA/exec';
const SECRET  = 'residencia2025';

const MEALS_USER  = ['almuerzo','cena','desayuno'];
const MEALS_ADMIN = ['almuerzo','cena','desayuno'];
const MEAL_ICON   = {almuerzo:'<i class="ti ti-tools-kitchen-2"></i>',cena:'<i class="ti ti-moon"></i>',desayuno:'<i class="ti ti-sun"></i>'};
const MEAL_LABEL  = {almuerzo:'Almuerzo', cena:'Cena', desayuno:'Desayuno'};

const DEFAULT_TIMES_BY_DOW = {
  lv: {
    desayuno: {on:'07:30', early:'06:30', late:'09:00'},
    almuerzo: {on:'13:30', early:'13:00', late:'15:00'},
    cena:     {on:'20:30', early:'20:00', late:'21:45'}
  },
  sab: {
    desayuno: {on:'08:00', early:'07:00', late:'09:30'},
    almuerzo: {on:'13:30', early:'13:00', late:'15:00'},
    cena:     {on:'20:30', early:'20:00', late:'21:45'}
  },
  dom: {
    desayuno: {on:'09:00', early:'08:00', late:'09:45'},
    almuerzo: {on:'13:30', early:'13:00', late:'15:00'},
    cena:     {on:'20:00', early:'19:30', late:'21:45'}
  }
};
function getDT(date){
  const dow=date.getDay();
  if(dow===0) return DEFAULT_TIMES_BY_DOW.dom;
  if(dow===6) return DEFAULT_TIMES_BY_DOW.sab;
  return DEFAULT_TIMES_BY_DOW.lv;
}
function getDefaultTime(date,meal,state){
  const dt=getDT(date);
  return dt[meal][state==='off'?'on':state]||'00:00';
}
const STATES      = ['off','on','early','late'];
const STATE_LABEL = {off:'No come', on:'Normal', early:'Temprano', late:'Tarde'};
const DAYS_ES     = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DAYS_ES_SHORT = ['dom','lun','mar','mié','jue','vie','sáb'];
const MONTHS_ES   = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

let currentTab = 'mi-vista';
let currentDayIdx = 0; // índice del día activo en el carrusel de Mi vista
let remoteData  = {};
let syncStatus  = 'idle';
let lastSync    = null;
let saveTimers  = {};

/* ════════ NORMALIZACIÓN DE FECHAS ════════ */
function normalizeFecha(f){
  if(!f) return '';
  f = String(f).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(f)) return f;
  const d = new Date(f);
  if(!isNaN(d.getTime())){
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,'0');
    const dy=String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+dy;
  }
  return f;
}
function normalizeRemoteData(raw){
  const out={};
  Object.keys(raw).forEach(usuario=>{
    out[usuario]={};
    Object.keys(raw[usuario]).forEach(fecha=>{
      out[usuario][normalizeFecha(fecha)]=raw[usuario][fecha];
    });
  });
  return out;
}

/* ════════ LOCAL STORAGE ════════ */
function gl(){
  try{
    const s = JSON.parse(localStorage.getItem('comiditapp_v1')||'null');
    if(s && !s.weekTemplate) s.weekTemplate={};
    return s;
  }catch(e){ return null; }
}
function sl(s){ localStorage.setItem('comiditapp_v1', JSON.stringify(s)); }
function initS(name){ const s={userName:name,bookings:{},dayNotes:{},guests:[],guestBookings:{},weekTemplate:{},isAdmin:false}; sl(s); return s; }

/* ════════ HELPERS DE FECHA ════════ */
function get7Days(){ const d=new Date(),r=[]; for(let i=0;i<7;i++){ const x=new Date(d); x.setDate(d.getDate()+i); r.push(x); } return r; }
function dayKey(d){ return d.toISOString().slice(0,10); }
function getDeadline(date){
  const dow=date.getDay();
  if(dow===0) return {h:10,m:0};
  if(dow===6) return {h:9,m:15};
  return {h:8,m:30};
}
function isMealLocked(date, meal){
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const reportDay = new Date(date);
  const tgt=new Date(reportDay.getFullYear(),reportDay.getMonth(),reportDay.getDate());
  if(tgt<today) return true;
  if(tgt.getTime()===today.getTime()){
    const dl=getDeadline(reportDay);
    if(now.getHours()>dl.h||(now.getHours()===dl.h&&now.getMinutes()>=dl.m)) return true;
  }
  return false;
}
function isLocked(date){
  return isMealLocked(date,'almuerzo') && isMealLocked(date,'cena') && isMealLocked(date,'desayuno');
}
function fmtDate(d){ return DAYS_ES[d.getDay()]+' '+d.getDate()+' de '+MONTHS_ES[d.getMonth()]; }
function fmtDateShort(d){ return DAYS_ES_SHORT[d.getDay()]+' '+d.getDate(); }
function initials(n){ return n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function nextState(cur){ return STATES[(STATES.indexOf(cur)+1)%STATES.length]; }
function nextOccurrence(dow){
  const d=new Date();
  const diff=(dow - d.getDay() + 7) % 7;
  d.setDate(d.getDate()+diff);
  return d;
}

/* ════════ PALETA DE COLORES POR USUARIO ════════ */
const COLOR_PALETTE = [
  {bg:'#E1F5EE',border:'#1D9E75',text:'#0F6E56'},
  {bg:'#E8F0FB',border:'#5B8DEF',text:'#2355B0'},
  {bg:'#FEF3E2',border:'#E8A838',text:'#8A5E00'},
  {bg:'#F3E8FB',border:'#A855D4',text:'#6B1FAF'},
  {bg:'#E8F7FA',border:'#29B6D4',text:'#0A7A94'},
  {bg:'#FDE8EE',border:'#E8557A',text:'#A0194A'},
  {bg:'#EAF3DE',border:'#639922',text:'#3B6D11'},
  {bg:'#FFF0E8',border:'#E87A2A',text:'#8A3D00'},
  {bg:'#E8EEF7',border:'#5B7FBF',text:'#1E3F7A'},
  {bg:'#F7E8F0',border:'#C45B8D',text:'#7A1A4A'},
  {bg:'#E8F5F0',border:'#3BAF85',text:'#0D6B50'},
  {bg:'#F5F0E8',border:'#B09050',text:'#6B5500'},
];
const _colorMap={};
let _colorIdx=0;
function colorForName(name){
  if(!_colorMap[name]){
    _colorMap[name]=COLOR_PALETTE[_colorIdx % COLOR_PALETTE.length];
    _colorIdx++;
  }
  return _colorMap[name];
}

/* ════════ API JSONP ════════ */
let _cbCounter = 0;
function jsonp(params){
  return new Promise((resolve)=>{
    const cbName = '_cb' + (++_cbCounter);
    const timeout = setTimeout(()=>{
      delete window[cbName];
      const tag = document.getElementById(cbName);
      if(tag) tag.remove();
      resolve({ok:false, error:'timeout'});
    }, 10000);
    window[cbName] = function(data){
      clearTimeout(timeout);
      delete window[cbName];
      const tag = document.getElementById(cbName);
      if(tag) tag.remove();
      resolve(data);
    };
    const qs = new URLSearchParams({...params, secret:SECRET, callback:cbName}).toString();
    const script = document.createElement('script');
    script.id = cbName;
    script.src = API_URL + '?' + qs;
    script.onerror = ()=>{
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
      resolve({ok:false, error:'network error'});
    };
    document.head.appendChild(script);
  });
}

async function loadRemote(){
  syncStatus='loading'; renderSyncBar();
  const res = await jsonp({action:'load'});
  if(res.ok){ remoteData=normalizeRemoteData(res.data||{}); lastSync=new Date(); syncStatus='ok'; }
  else { syncStatus='error'; }
  renderSyncBar();
  autoSyncTemplate();
  render();
}

function autoSyncTemplate(){
  const s=gl();
  if(!s||s.isAdmin||!s.weekTemplate||!Object.keys(s.weekTemplate).length) return;
  const days=get7Days();
  let changed=false;
  days.forEach(day=>{
    const dk=dayKey(day);
    const nextDay=new Date(day); nextDay.setDate(day.getDate()+1);
    const dkNext=dayKey(nextDay);
    MEALS_USER.forEach(m=>{
      const storeDk = m==='desayuno' ? dkNext : dk;
      const dowDate = m==='desayuno' ? nextDay : day;
      if(isMealLocked(day,m)) return;
      const hasLocalManual = s.bookings[storeDk] && s.bookings[storeDk][m] && s.bookings[storeDk][m].state!==undefined;
      if(hasLocalManual) return;
      const hasRemote = remoteData[s.userName] && remoteData[s.userName][storeDk] && remoteData[s.userName][storeDk][m];
      if(hasRemote) return;
      const tplVal=getTplState(s, dowDate, m);
      if(!tplVal || tplVal.state==='off') return;
      if(!s.bookings[storeDk]) s.bookings[storeDk]={};
      s.bookings[storeDk][m]={state:tplVal.state, time:tplVal.time};
      const nota=(s.dayNotes&&s.dayNotes[storeDk])||'';
      schedSave(s.userName, storeDk, m, tplVal.state, tplVal.time, nota);
      changed=true;
    });
  });
  if(changed) sl(s);
}

async function saveRow(usuario,fecha,comida,estado,hora,nota){
  await jsonp({action:'save',usuario,fecha,comida,estado,hora,nota});
}
function schedSave(usuario,fecha,comida,estado,hora,nota){
  const key=usuario+'_'+fecha+'_'+comida;
  clearTimeout(saveTimers[key]);
  saveTimers[key]=setTimeout(()=>saveRow(usuario,fecha,comida,estado,hora,nota),900);
}

/* ════════ MI VISTA — CARRUSEL DE DÍAS ════════ */
function renderMiVistaCarousel(s){
  const days=get7Days();
  if(currentDayIdx<0) currentDayIdx=0;
  if(currentDayIdx>6) currentDayIdx=6;

  let slides='';
  days.forEach((day,idx)=>{ slides+=`<div class="day-slide">${renderDaySlide(s,day,idx)}</div>`; });

  let dots='';
  days.forEach((d,idx)=>{ dots+=`<span class="day-dot ${idx===currentDayIdx?'active':''}" onclick="goToDay(${idx})"></span>`; });

  const day=days[currentDayIdx];

  return `
    <div class="day-nav-row">
      <button class="day-nav-btn" onclick="goToDay(${currentDayIdx-1})" ${currentDayIdx===0?'disabled':''}><i class="ti ti-chevron-left"></i></button>
      <div>
        <div class="day-title-big">${currentDayIdx===0?'Hoy':DAYS_ES[day.getDay()]}</div>
        <div class="day-title-sub">${fmtDate(day)}</div>
      </div>
      <button class="day-nav-btn" onclick="goToDay(${currentDayIdx+1})" ${currentDayIdx===6?'disabled':''}><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="day-carousel" id="day-carousel">
      <div class="day-carousel-track" id="day-track" style="transform:translateX(-${currentDayIdx*100}%)">
        ${slides}
      </div>
    </div>
    <div class="day-dots">${dots}</div>`;
}

function goToDay(idx){
  if(idx<0||idx>6) return;
  currentDayIdx=idx;
  const track=document.getElementById('day-track');
  if(track) track.style.transform=`translateX(-${idx*100}%)`;
  // re-render nav row + dots without losing transition
  const s=gl();
  setTimeout(()=>{ render(); }, 220);
}

function renderDaySlide(s, day, idx){
  const dk=dayKey(day);
  const nextDay=new Date(day); nextDay.setDate(day.getDate()+1);
  const dkNext=dayKey(nextDay);
  const locked=isLocked(day);
  const b=s.bookings[dk]||{};
  const bNext=s.bookings[dkNext]||{};
  const note=(s.dayNotes&&s.dayNotes[dk])||'';

  let rows='';
  MEALS_USER.forEach(m=>{
    const storeDk = m==='desayuno' ? dkNext : dk;
    const bk = m==='desayuno' ? bNext : b;
    const info=bk[m];
    const dayForTime = m==='desayuno' ? nextDay : day;
    let st, t, fromTpl=false;
    if(info && info.state!==undefined){ st=info.state; t=info.time||getDefaultTime(dayForTime,m,st); }
    else {
      const tplVal=getTplState(s, dayForTime, m);
      if(tplVal){ st=tplVal.state; t=tplVal.time||getDefaultTime(dayForTime,m,st); fromTpl=true; }
      else { st='off'; t=getDefaultTime(dayForTime,m,st); }
    }
    const mLocked=isMealLocked(day,m);
    const suffix = m==='desayuno' ? `<small> · ${DAYS_ES_SHORT[nextDay.getDay()]}</small>` : '';
    const statusText = st==='off' ? 'No come' : (STATE_LABEL[st]+' · '+fmtTime12(t));

    rows+=`<div class="meal-row-app ${mLocked?'locked':''}" ${!mLocked?`onclick="openMealSheet('${storeDk}','${m}',${idx},${fromTpl})"`:''}>
      <div class="meal-icon-box ${m}">${MEAL_ICON[m]}</div>
      <div class="meal-info">
        <div class="meal-name">${MEAL_LABEL[m]}${suffix}</div>
        <div class="meal-status ${st}">${fromTpl&&st!=='off'?'<span class="tpl-dot"></span>':''}${statusText}</div>
        ${mLocked?`<div class="lock-badge"><i class="ti ti-lock" style="font-size:10px"></i> Cerrado</div>`:''}
      </div>
      ${!mLocked?'<i class="ti ti-chevron-right meal-chevron"></i>':''}
    </div>`;
  });

  return `
    <div class="meal-card">${rows}</div>
    <div class="note-card">
      <i class="ti ti-pencil" style="font-size:15px;color:#ccc"></i>
      <input type="text" placeholder="Nota del día (dieta blanda, bolsa, etc.…)"
        value="${note.replace(/"/g,'&quot;')}"
        ${locked?'disabled':''}
        onchange="setDayNote('${dk}',this.value)"/>
    </div>`;
}

function fmtTime12(t){
  if(!t || !/^\d{1,2}:\d{2}$/.test(t)) return t||'';
  let [h,m]=t.split(':').map(Number);
  const ap = h>=12 ? 'p.m.' : 'a.m.';
  h = h%12; if(h===0) h=12;
  return h+':'+String(m).padStart(2,'0')+' '+ap;
}

/* ════════ SWIPE GESTURE ════════ */
let touchStartX=0, touchDeltaX=0, touchActive=false;
function attachSwipe(){
  const el=document.getElementById('day-carousel');
  if(!el) return;
  el.addEventListener('touchstart', e=>{
    touchStartX=e.touches[0].clientX; touchActive=true; touchDeltaX=0;
  }, {passive:true});
  el.addEventListener('touchmove', e=>{
    if(!touchActive) return;
    touchDeltaX = e.touches[0].clientX - touchStartX;
    const track=document.getElementById('day-track');
    if(track){
      const base = -currentDayIdx*100;
      const pct = (touchDeltaX / el.clientWidth) * 100;
      track.style.transition='none';
      track.style.transform=`translateX(${base+pct}%)`;
    }
  }, {passive:true});
  el.addEventListener('touchend', ()=>{
    touchActive=false;
    const track=document.getElementById('day-track');
    if(track) track.style.transition='';
    if(Math.abs(touchDeltaX) > 60){
      if(touchDeltaX < 0 && currentDayIdx < 6) goToDay(currentDayIdx+1);
      else if(touchDeltaX > 0 && currentDayIdx > 0) goToDay(currentDayIdx-1);
      else goToDay(currentDayIdx);
    } else {
      if(track) track.style.transform=`translateX(-${currentDayIdx*100}%)`;
    }
    touchDeltaX=0;
  });
}

/* ════════ BOTTOM SHEET — selector de comida ════════ */
let sheetCtx=null;

function openMealSheet(storeDk, meal, dayIdx, fromTpl){
  const s=gl();
  const dayObj=new Date(storeDk+'T12:00:00');
  let cur;
  if(s.bookings[storeDk]&&s.bookings[storeDk][meal]&&s.bookings[storeDk][meal].state!==undefined){
    cur=s.bookings[storeDk][meal];
  } else if(fromTpl){
    cur=getTplState(s,dayObj,meal)||{state:'off',time:getDefaultTime(dayObj,meal,'off')};
  } else {
    cur={state:'off',time:getDefaultTime(dayObj,meal,'off')};
  }
  sheetCtx={storeDk, meal, dayObj, state:cur.state||'off', time:cur.time||getDefaultTime(dayObj,meal,cur.state)};
  renderSheet();
}

function renderSheet(){
  let overlay=document.getElementById('meal-sheet-overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='meal-sheet-overlay';
    overlay.className='sheet-overlay';
    document.body.appendChild(overlay);
  }
  const {meal,state,time}=sheetCtx;
  const days=get7Days();
  const dayLabel = fmtDate(sheetCtx.dayObj);

  let opts='';
  STATES.forEach(st=>{
    opts+=`<div class="sheet-opt ${state===st?'sel':''}" onclick="selectSheetState('${st}')">
      <span class="sheet-opt-label">${STATE_LABEL[st]}</span>
      ${state===st?'<i class="ti ti-check" style="color:#0F6E56"></i>':''}
    </div>`;
  });

  overlay.innerHTML=`
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${MEAL_ICON[meal]} ${MEAL_LABEL[meal]}</div>
      <div class="sheet-subtitle">${dayLabel}</div>
      <div class="sheet-opts">${opts}</div>
      ${state!=='off'?`<div class="sheet-time-row">
        <label>Hora</label>
        <input type="time" id="sheet-time-input" value="${time}" onchange="updateSheetTime(this.value)"/>
      </div>`:''}
      <button class="sheet-close" onclick="closeSheet()">Cerrar</button>
    </div>`;
  requestAnimationFrame(()=>overlay.classList.add('show'));
  overlay.onclick=(e)=>{ if(e.target===overlay) closeSheet(); };
}

function selectSheetState(st){
  sheetCtx.state=st;
  if(st!=='off'){
    sheetCtx.time=getDefaultTime(sheetCtx.dayObj, sheetCtx.meal, st);
  }
  commitSheet();
  renderSheet();
}

function updateSheetTime(val){
  sheetCtx.time=val;
  commitSheet();
}

function commitSheet(){
  const s=gl();
  const {storeDk,meal,state,time}=sheetCtx;
  if(!s.bookings[storeDk]) s.bookings[storeDk]={};
  s.bookings[storeDk][meal]={state, time};
  sl(s);
  const nota=(s.dayNotes&&s.dayNotes[storeDk])||'';
  schedSave(s.userName, storeDk, meal, state, time, nota);
}

function closeSheet(){
  const overlay=document.getElementById('meal-sheet-overlay');
  if(overlay){
    overlay.classList.remove('show');
    setTimeout(()=>{ overlay.remove(); render(); }, 200);
  }
}

function setDayNote(dk,val){
  const s=gl();
  if(!s.dayNotes) s.dayNotes={};
  s.dayNotes[dk]=val; sl(s);
  MEALS_USER.forEach(m=>{
    const info=(s.bookings[dk]&&s.bookings[dk][m])||{state:'off',time:''};
    schedSave(s.userName,dk,m,info.state,info.time||'',val);
  });
}

/* ════════ SEMANA TIPO ════════ */
const DOW_ORDER = [1,2,3,4,5,6,0];
const DOW_LABEL = {0:'domingo',1:'lunes',2:'martes',3:'miércoles',4:'jueves',5:'viernes',6:'sábado'};

function renderSemanaTipo(s){
  let html=`<p class="tpl-intro">Configura tu patrón habitual de comidas. Se usará como punto de partida cada semana — lo verás marcado con un puntito hasta que lo confirmes o cambies para un día concreto.</p>`;
  DOW_ORDER.forEach(dow=>{
    const tpl=(s.weekTemplate&&s.weekTemplate[dow])||{};
    html+=`<div class="tpl-day-card">
      <div class="tpl-day-header">${DOW_LABEL[dow].charAt(0).toUpperCase()+DOW_LABEL[dow].slice(1)}</div>`;
    MEALS_USER.forEach(m=>{
      const info=tpl[m]||{state:'off'};
      const st=info.state||'off';
      const refDay=nextOccurrence(dow);
      const dayForTime = m==='desayuno' ? (()=>{ const n=new Date(refDay); n.setDate(n.getDate()+1); return n; })() : refDay;
      const t=info.time||getDefaultTime(dayForTime,m,st);
      const suffix = m==='desayuno' ? ` <small style="color:#aaa;font-weight:500">(día siguiente)</small>` : '';
      const statusText = st==='off' ? 'No come' : (STATE_LABEL[st]+' · '+fmtTime12(t));
      html+=`<div class="meal-row-app" onclick="openTplSheet(${dow},'${m}')">
        <div class="meal-icon-box ${m}">${MEAL_ICON[m]}</div>
        <div class="meal-info">
          <div class="meal-name">${MEAL_LABEL[m]}${suffix}</div>
          <div class="meal-status ${st}">${statusText}</div>
        </div>
        <i class="ti ti-chevron-right meal-chevron"></i>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`<button class="add-btn" onclick="clearTpl()"><i class="ti ti-trash"></i> Borrar toda mi semana tipo</button>`;
  return html;
}

let tplSheetCtx=null;
function openTplSheet(dow, meal){
  const s=gl();
  const tpl=(s.weekTemplate&&s.weekTemplate[dow])||{};
  const info=tpl[meal]||{state:'off'};
  const refDay=nextOccurrence(dow);
  const dayForTime = meal==='desayuno' ? (()=>{ const n=new Date(refDay); n.setDate(n.getDate()+1); return n; })() : refDay;
  tplSheetCtx={dow, meal, dayForTime, state:info.state||'off', time:info.time||getDefaultTime(dayForTime,meal,info.state||'off')};
  renderTplSheet();
}

function renderTplSheet(){
  let overlay=document.getElementById('meal-sheet-overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='meal-sheet-overlay';
    overlay.className='sheet-overlay';
    document.body.appendChild(overlay);
  }
  const {dow,meal,state,time}=tplSheetCtx;
  let opts='';
  STATES.forEach(st=>{
    opts+=`<div class="sheet-opt ${state===st?'sel':''}" onclick="selectTplSheetState('${st}')">
      <span class="sheet-opt-label">${STATE_LABEL[st]}</span>
      ${state===st?'<i class="ti ti-check" style="color:#0F6E56"></i>':''}
    </div>`;
  });
  overlay.innerHTML=`
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${MEAL_ICON[meal]} ${MEAL_LABEL[meal]}</div>
      <div class="sheet-subtitle">${DOW_LABEL[dow].charAt(0).toUpperCase()+DOW_LABEL[dow].slice(1)} · semana tipo</div>
      <div class="sheet-opts">${opts}</div>
      ${state!=='off'?`<div class="sheet-time-row">
        <label>Hora</label>
        <input type="time" id="sheet-time-input" value="${time}" onchange="updateTplSheetTime(this.value)"/>
      </div>`:''}
      <button class="sheet-close" onclick="closeSheet()">Cerrar</button>
    </div>`;
  requestAnimationFrame(()=>overlay.classList.add('show'));
  overlay.onclick=(e)=>{ if(e.target===overlay) closeSheet(); };
}

function selectTplSheetState(st){
  tplSheetCtx.state=st;
  if(st!=='off') tplSheetCtx.time=getDefaultTime(tplSheetCtx.dayForTime, tplSheetCtx.meal, st);
  commitTplSheet();
  renderTplSheet();
}
function updateTplSheetTime(val){ tplSheetCtx.time=val; commitTplSheet(); }
function commitTplSheet(){
  const s=gl();
  const {dow,meal,state,time}=tplSheetCtx;
  if(!s.weekTemplate) s.weekTemplate={};
  if(!s.weekTemplate[dow]) s.weekTemplate[dow]={};
  s.weekTemplate[dow][meal]={state,time};
  sl(s);
}
function clearTpl(){
  if(!confirm('¿Borrar toda tu semana tipo? Esto no afecta lo que ya tienes guardado en días concretos.')) return;
  const s=gl();
  s.weekTemplate={};
  sl(s); render();
}

/* ════════ INVITADOS ════════ */
function renderInvitados(s){
  let html=`<div class="guests-mgr">
    <h4><i class="ti ti-user-plus"></i> Gestionar invitados</h4>`;
  (s.guests||[]).forEach(g=>{
    html+=`<div class="guest-row-item">
      <input type="text" value="${g.name.replace(/"/g,'&quot;')}" onchange="renameGuest('${g.id}',this.value)" placeholder="Nombre del invitado"/>
      <button class="del-btn" onclick="deleteGuest('${g.id}')"><i class="ti ti-x" style="font-size:14px"></i></button>
    </div>`;
  });
  html+=`<button class="add-btn" onclick="addGuest()"><i class="ti ti-plus"></i> Añadir invitado</button></div>`;

  if((s.guests||[]).length>0){
    html+=`<div class="section-title">Comidas de invitados por día</div>`;
    const days=get7Days();
    days.forEach((day,idx)=>{
      const dk=dayKey(day);
      const locked=isLocked(day);
      html+=`<div class="meal-card">
        <div class="tpl-day-header">${idx===0?'Hoy · ':''}${fmtDate(day)} ${locked?'<span style="color:#A32D2D;font-size:11px;font-weight:600;float:right"><i class="ti ti-lock" style="font-size:11px"></i> Cerrado</span>':''}</div>`;
      s.guests.forEach(g=>{
        const gb=(s.guestBookings[dk]||{})[g.id]||{};
        html+=`<div class="guest-name-label">${g.name}</div>`;
        MEALS_USER.forEach(m=>{
          const info=gb[m]||{state:'off'};
          const st=info.state||'off';
          const t=info.time||getDefaultTime(day,m,st);
          const statusText = st==='off' ? 'No come' : (STATE_LABEL[st]+' · '+fmtTime12(t));
          html+=`<div class="meal-row-app ${locked?'locked':''}" ${!locked?`onclick="openGuestSheet('${dk}','${g.id}','${m}')"`:''}>
            <div class="meal-icon-box ${m}">${MEAL_ICON[m]}</div>
            <div class="meal-info">
              <div class="meal-name">${MEAL_LABEL[m]}</div>
              <div class="meal-status ${st}">${statusText}</div>
            </div>
            ${!locked?'<i class="ti ti-chevron-right meal-chevron"></i>':''}
          </div>`;
        });
      });
      html+=`</div>`;
    });
  }
  return html;
}

function addGuest(){
  const s=gl(); if(!s.guests) s.guests=[];
  s.guests.push({id:'g'+Date.now(),name:'Invitado'});
  sl(s); render();
}
function renameGuest(gid,name){
  const s=gl(); const g=(s.guests||[]).find(x=>x.id===gid);
  if(g){ g.name=name; sl(s); }
}
function deleteGuest(gid){
  const s=gl(); s.guests=(s.guests||[]).filter(g=>g.id!==gid);
  sl(s); render();
}

let guestSheetCtx=null;
function openGuestSheet(dk,gid,meal){
  const s=gl();
  const gb=(s.guestBookings[dk]||{})[gid]||{};
  const info=gb[meal]||{state:'off'};
  const dayObj=new Date(dk+'T12:00:00');
  guestSheetCtx={dk,gid,meal,dayObj,state:info.state||'off',time:info.time||getDefaultTime(dayObj,meal,info.state||'off')};
  renderGuestSheet();
}
function renderGuestSheet(){
  let overlay=document.getElementById('meal-sheet-overlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='meal-sheet-overlay';
    overlay.className='sheet-overlay';
    document.body.appendChild(overlay);
  }
  const {meal,state,time}=guestSheetCtx;
  const s=gl();
  const g=(s.guests||[]).find(x=>x.id===guestSheetCtx.gid);
  let opts='';
  STATES.forEach(st=>{
    opts+=`<div class="sheet-opt ${state===st?'sel':''}" onclick="selectGuestSheetState('${st}')">
      <span class="sheet-opt-label">${STATE_LABEL[st]}</span>
      ${state===st?'<i class="ti ti-check" style="color:#0F6E56"></i>':''}
    </div>`;
  });
  overlay.innerHTML=`
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${MEAL_ICON[meal]} ${MEAL_LABEL[meal]}</div>
      <div class="sheet-subtitle">${g?g.name:'Invitado'} · ${fmtDate(guestSheetCtx.dayObj)}</div>
      <div class="sheet-opts">${opts}</div>
      ${state!=='off'?`<div class="sheet-time-row">
        <label>Hora</label>
        <input type="time" id="sheet-time-input" value="${time}" onchange="updateGuestSheetTime(this.value)"/>
      </div>`:''}
      <button class="sheet-close" onclick="closeSheet()">Cerrar</button>
    </div>`;
  requestAnimationFrame(()=>overlay.classList.add('show'));
  overlay.onclick=(e)=>{ if(e.target===overlay) closeSheet(); };
}
function selectGuestSheetState(st){
  guestSheetCtx.state=st;
  if(st!=='off') guestSheetCtx.time=getDefaultTime(guestSheetCtx.dayObj, guestSheetCtx.meal, st);
  commitGuestSheet();
  renderGuestSheet();
}
function updateGuestSheetTime(val){ guestSheetCtx.time=val; commitGuestSheet(); }
function commitGuestSheet(){
  const s=gl();
  const {dk,gid,meal,state,time}=guestSheetCtx;
  if(!s.guestBookings[dk]) s.guestBookings[dk]={};
  if(!s.guestBookings[dk][gid]) s.guestBookings[dk][gid]={};
  s.guestBookings[dk][gid][meal]={state,time};
  sl(s);
  const g=(s.guests||[]).find(x=>x.id===gid);
  const gName=(g?g.name:gid)+' (inv.)';
  schedSave(gName, dk, meal, state, time, '');
}

/* ════════ ADMINISTRACIÓN ════════ */
function getAllForDay(s,dk,dayObj){
  const result=[];
  const allUsers=new Set(Object.keys(remoteData));
  if(s.userName) allUsers.add(s.userName);
  allUsers.forEach(usuario=>{
    const remoteDay=(remoteData[usuario]&&remoteData[usuario][dk])||null;
    const localDay=(usuario===s.userName)?(s.bookings[dk]||{}):null;
    const dayData=remoteDay||localDay||{};
    const entry={name:usuario,isGuest:false};
    MEALS_ADMIN.forEach(m=>{ entry[m]=dayData[m]||{state:'off'}; });
    result.push(entry);
  });
  (s.guests||[]).forEach(g=>{
    const gKey=g.name+' (inv.)';
    if(allUsers.has(gKey)) return;
    const gb=(s.guestBookings[dk]||{})[g.id]||{};
    const ge={name:g.name+' (inv.)',isGuest:true};
    MEALS_ADMIN.forEach(m=>{ ge[m]=gb[m]||{state:'off'}; });
    result.push(ge);
  });
  return result;
}

function renderAdmin(s){
  const days=get7Days();
  let html=`<div class="section-title">Resumen para la administración</div>`;
  days.forEach((day,idx)=>{
    const dk=dayKey(day);
    const entries=getAllForDay(s,dk,day);
    const counts={almuerzo:{on:0,early:0,late:0},cena:{on:0,early:0,late:0},desayuno:{on:0,early:0,late:0}};
    const names={almuerzo:[],cena:[],desayuno:[]};
    entries.forEach(e=>{
      MEALS_ADMIN.forEach(m=>{
        const st=(e[m]&&e[m].state)||'off';
        if(st!=='off'){
          counts[m][st]=(counts[m][st]||0)+1;
          const t=e[m].time||getDefaultTime(day,m,st);
          const extra=st!=='on'?` (${st==='early'?'temp.':'tarde'} ${t})`:'';
          names[m].push({label:e.name+extra, name:e.name});
        }
      });
    });
    const totalFor=m=>counts[m].on+counts[m].early+counts[m].late;
    const total=totalFor('almuerzo')+totalFor('cena')+totalFor('desayuno');

    const nextDay=new Date(day); nextDay.setDate(day.getDate()+1);
    const nextDayLabel=DAYS_ES[nextDay.getDay()];

    html+=`<div class="admin-summary-card">
      <div class="admin-summary-hdr">
        <span class="admin-summary-title">${idx===0?'Hoy · ':''}${fmtDate(day)}</span>
        <span class="admin-summary-count">${total} asist.</span>
      </div>
      <div class="admin-counts-row">`;
    MEALS_ADMIN.forEach(m=>{
      const ton=counts[m].on, tep=counts[m].early, trd=counts[m].late;
      const ttl=totalFor(m);
      let numHtml=`<span class="ac-num-main ${ttl===0?'zero':''}">${ton}</span>`;
      if(tep>0) numHtml+=`<span class="ac-badge early">+${tep}&#x2B06;</span>`;
      if(trd>0) numHtml+=`<span class="ac-badge late">+${trd}&#x2B07;</span>`;
      html+=`<div class="ac">
        <div class="ac-label">${MEAL_LABEL[m]}</div>
        <div class="ac-num-wrap">${numHtml}</div>
      </div>`;
    });
    html+=`</div>`;

    const verbos = {almuerzo:'Almuerzan', cena:'Cenan', desayuno:`Desayunan (${nextDayLabel})`};
    MEALS_ADMIN.forEach(m=>{
      if(names[m].length){
        const lista=names[m].map(n=>{
          const c=colorForName(n.name);
          return `<span class="ntag"><span class="ntag-dot" style="background:${c.border}"></span>${n.label}</span>`;
        }).join(' ');
        html+=`<div class="admin-meal-line">
          <span class="admin-meal-verb">${verbos[m]}</span>
          <span class="admin-meal-tags">${lista}</span>
        </div>`;
      }
    });

    const notasConAutor=[];
    const allUsersForNotes=new Set(Object.keys(remoteData));
    if(s.userName) allUsersForNotes.add(s.userName);
    allUsersForNotes.forEach(usuario=>{
      const uDay=(usuario===s.userName)
        ? {nota:(s.dayNotes&&s.dayNotes[dk])||''}
        : ((remoteData[usuario]&&remoteData[usuario][dk])||{});
      const n=(uDay.nota||'').trim();
      if(n) notasConAutor.push('<strong>'+usuario+':</strong> '+n);
    });
    if(notasConAutor.length){
      html+=`<div class="day-note-admin"><i class="ti ti-pencil"></i> `+notasConAutor.join(' &nbsp;·&nbsp; ')+`</div>`;
    }
    html+=`</div>`;
  });
  return html;
}

/* ════════ INIT ════════ */
const _s=gl();
if(_s && (_s.userName || _s.isAdmin) && !_s.pendingChoice){ loadRemote(); } else { render(); }
setInterval(()=>{ const ss=gl(); if(ss && (ss.userName||ss.isAdmin) && !ss.pendingChoice) loadRemote(); }, 60000);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
